name: Direct loader ABI audit
on:
  push:
    branches: [android-preservation]
    paths:
      - 'patches/shim/**'
      - 'scripts/shim/**'
      - '.github/workflows/direct-loader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 external/slop
      - run: python3 scripts/shim/audit-preservation.py
      - uses: actions/upload-artifact@v4
        with:
          name: direct-loader-abi-audit-not-a-boot-image
          path: out/direct-loader-audit/*/report.json
          if-no-files-found: error
